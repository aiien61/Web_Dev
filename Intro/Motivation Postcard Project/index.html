<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mt. Jade Postcard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
</head>
<body>
    <div id="gallery">
        <h1>Postcard Gallery</h1>
        <div class="postcard mountain">
            <img src="./assets/images/ChatGPT-Image-Mt-Jade.png" alt="summit of mountain Jade">
            <h2>Heart of Mt. Jade</h2>
            <p>Touch the sky on Taiwan's spine</p>
        </div>

        <div class="postcard lake">
            <img src="./assets/images/ChatGPT-Image-SunMoonLake.png" alt="landscape of Sun Moon Lake">
            <h2>Discover Sun Moon Lake</h2>
            <p>Breathe in beauty at Taiwan’s tranquil gem</p>
        </div>
    </div>
    

</body>
</html>
