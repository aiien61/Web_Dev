<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CSS Flag Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- 
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<!-- more flags: http://lascarid.es/fussyflags/ -->

<body>
    <h1>Flags Gallery</h1>
    <div class="laos">
        <p>The Flag</p>
        <div>
            <div>
                <p>of Laos</p>
            </div>
        </div>
    </div>

    <div class="japan">
        <p>The Flag</p>
        <div>
            <p>of Japan</p>
        </div>
    </div>
    
    <div class="peru">
        <div></div>
    </div>
    <h2>Peru</h2>

    <div class="finland">
        <div class="horizontal"></div>
        <div class="vertical"></div>
    </div>
    <h2>Finland</h2>

    <div class="indonesia">
        <div></div>
    </div>
    <h2>Indonesia</h2>
</body>

</html>
