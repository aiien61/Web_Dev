<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondrian Project</title>
    <style>
        /* 
            Gap Colour: #000
            White: #F0F1EC
            Red: #E72F24
            Black: #232629
            Blue: #004592
            Yellow: #F9D01E
        */

        .container {
            width: 748px;
            height: 748px;
            background-color: #000;
            display: grid;
            gap: 9px;
            grid-template-columns: 320px 198px 153px 50px;
            grid-template-rows: 414px 130px 155px 22px;
        }

        .red {
            background-color: #E72F24;
        }

        .blue {
            background-color: #004592;
            grid-column-start: 4;
            grid-row-start: 2;
            border-bottom: 10px solid #000;
        }

        .yellow {
            background-color: #F9D01E;
            grid-column-start: 2;
            grid-row-start: 4;
        }

        .black {
            background-color: #232629;
            grid-column-start: 3;
            grid-row-start: 4;
        }

        .white {
            background-color: #F0F1EC;
        }

        .w1 {
            grid-column: span 3;
        }

        .w2 {
            grid-row: span 2;
        }
        
        .w3 {
            grid-area: 2 / 2 / 4 / 4;
        }

        .w4 {
            grid-row: span 2;
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="red"></div>
        <div class="blue"></div>
        <div class="black"></div>
        <div class="yellow"></div>
        <div class="white w1"></div>
        <div class="white w2"></div>
        <div class="white w3"></div>
        <div class="white w4"></div>
        <div class="white w5"></div>
    </div>
</body>

</html>
