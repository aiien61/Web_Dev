<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copilot Mondrian</title>
    <style>
        /* 
            Gap Colour: #000000
            White: #FFFFFF
            Red: #D42C2C
            Blue: #004592
            Yellow: #F9D33C
            Orange: #F28C28
        */

        .container {
            background-color: #000000;
            width: 784px;
            height: 760px;
            display: grid;
            gap: 8px;
            padding: 10px;
            grid-template-columns: repeat(9, 80px);
            grid-template-rows: repeat(6, 120px);
        }

        .item {
            background-color: #FFFFFF;
        }

        .red1 {
            background-color: #D42C2C;
            grid-column: span 4;
            grid-row: 3 / 5;
        }

        .red2 {
            background-color: #D42C2C;
            grid-column-start: 5;
            grid-row: 3 / 5;
        }

        .orange1 {
            background-color: #F28C28;
            grid-column: 7 / 9;
        }

        .orange2 {
            background-color: #F28C28;
            grid-column: 7 / 9;
            grid-row-start: 4;
        }

        .yellow {
            background-color: #F9D33C;
            grid-column: span 2;
            grid-row: 5 / -1;
        }

        .blue1 {
            background-color: #004592;
            grid-column-start: 9;
            grid-row: span 3;
        }

        .blue2 {
            background-color: #004592;
            grid-column: 6 / 9;
            grid-row: 5 / -1;
        }

        .white1 {
            grid-column: span 4;
            grid-row: 1 / 3;
        }

        .white2 {
            grid-column: span 2;
            grid-row-start: 1;
        }

        .white3 {
            grid-column: span 2;
            grid-row-start: 2;
        }

        .white4 {
            grid-column: 7 / 9;
            grid-row: 2 / 4;
        }

        .white5 {
            grid-row-start: 3;
        }

        .white6 {
            grid-row-start: 4;
        }

        .white7 {
            grid-column-start: 9;
            grid-row: 4 / 6;
        }

        .white8 {
            grid-column: 3 / 6;
        }

        .white9 {
            grid-column: 3 / 6;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item red1"></div>
        <div class="item red2"></div>
        <div class="item orange1"></div>
        <div class="item orange2"></div>
        <div class="item blue1"></div>
        <div class="item blue2"></div>
        <div class="item yellow"></div>
        <div class="item white1"></div>
        <div class="item white2"></div>
        <div class="item white3"></div>
        <div class="item white4"></div>
        <div class="item white5"></div>
        <div class="item white6"></div>
        <div class="item white7"></div>
        <div class="item white8"></div>
        <div class="item white9"></div>
        <div class="item white10"></div>
    </div>
</body>
</html>
